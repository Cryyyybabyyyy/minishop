{% extends "base.html" %}
{% block title %}Register — MiniShop{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="auth-sub">Register as a new customer.</p>

    <form method="post" action="{{ url_for('main.register') }}" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus
               placeholder="Choose a username" autocomplete="username" minlength="3">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               placeholder="At least 6 characters" autocomplete="new-password" minlength="6">
      </div>
      <div class="form-group">
        <label for="password2">Confirm Password</label>
        <input type="password" id="password2" name="password2" required
               placeholder="Repeat password" autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="{{ url_for('main.login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
