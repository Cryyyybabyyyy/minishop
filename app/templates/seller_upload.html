{% extends "base.html" %}
{% block title %}Upload Image — MiniShop{% endblock %}

{% block content %}
<section class="upload-section">
  <h1>Upload Product Image</h1>
  <p class="section-sub">Select a file and optionally assign it to a product.</p>

  <form method="post" enctype="multipart/form-data" class="upload-form">
    <div class="form-group">
      <label for="file">Choose file</label>
      <input type="file" id="file" name="file" required>
    </div>
    <div class="form-group">
      <label for="product_id">Assign to product (optional)</label>
      <select id="product_id" name="product_id">
        <option value="">— None —</option>
        {% for p in products %}
        <option value="{{ p.id }}">#{{ p.id }} — {{ p.name }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Upload</button>
    <a href="{{ url_for('main.seller_dashboard') }}" class="btn btn-outline">Cancel</a>
  </form>
</section>
{% endblock %}
